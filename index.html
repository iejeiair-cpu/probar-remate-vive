<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Probá Remate Vive</title>
<meta name="description" content="Sumate a la prueba cerrada de Remate Vive para Android en 3 pasos.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#003e2b">
<!-- Asistente guiado para verificadores de la prueba cerrada (Google Play). Un paso por pantalla.
     Sin formularios, cookies ni analítica. El avance se guarda solo en el navegador de la persona (localStorage).
     Cada confirmación es del usuario: Google no informa a esta página si una acción se completó. -->
<style>
:root{--verde:#003e2b;--verde2:#005536;--lima:#c9f24a;--texto:#172034;--gris:#64718a;--fondo:#f4f7f5}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--fondo);color:var(--texto);display:flex;flex-direction:column;min-height:100%;-webkit-text-size-adjust:100%}
header{background:var(--verde);color:#fff;padding:18px 20px;display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--verde2);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--lima);flex:0 0 auto}
header b{font-size:1.1rem}
main{flex:1;display:flex;flex-direction:column;max-width:30rem;width:100%;margin:0 auto;padding:28px 20px 24px}
.indicador{color:var(--gris);font-size:.9rem;margin:0 0 10px}
h1{font-size:1.7rem;line-height:1.2;margin:0 0 12px}
p{font-size:1.05rem;line-height:1.5;margin:0 0 12px;color:#3a4558}
.acciones{margin-top:auto;padding-top:24px}
.boton{display:block;width:100%;text-align:center;text-decoration:none;border:0;cursor:pointer;background:var(--verde);color:#fff;font:inherit;font-weight:800;letter-spacing:.02em;font-size:1.1rem;padding:18px 16px;border-radius:14px;box-shadow:0 0 0 3px var(--lima)}
.boton:active{background:var(--verde2)}
.secundario{display:block;width:100%;background:none;border:0;font:inherit;color:var(--verde2);text-decoration:underline;padding:14px 8px;margin-top:6px;cursor:pointer;font-size:.98rem}
.atras{background:none;border:0;font:inherit;color:var(--gris);padding:4px 0;margin:0 0 14px;cursor:pointer;font-size:.95rem;align-self:flex-start}
.final{text-align:center}
.final .sello{width:84px;height:84px;border-radius:50%;background:var(--verde);color:var(--lima);font-size:44px;display:flex;align-items:center;justify-content:center;margin:12px auto 18px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true">
    <svg width="28" height="28" viewBox="0 0 64 64" fill="#c9f24a"><g transform="rotate(-38 26 22)"><rect x="12" y="13" width="28" height="17" rx="3"/><rect x="9" y="11" width="5" height="21" rx="2"/><rect x="38" y="11" width="5" height="21" rx="2"/></g><rect x="31" y="22" width="6" height="30" rx="3" transform="rotate(-38 34 37)"/><rect x="21" y="45" width="20" height="4" rx="2"/><rect x="17" y="50" width="28" height="5" rx="2.5"/></svg>
  </div>
  <b>Remate Vive · Prueba en Android</b>
</header>
<main id="pantalla" aria-live="polite"></main>
<script>
(function(){
  // Pasos con sus enlaces oficiales (Grupos de Google y Google Play).
  var PASOS=[
    {titulo:'Unite al grupo de prueba',texto:'Se abre Grupos de Google. Tocá «Unirse al grupo» con la misma cuenta de Google que usás en el Play Store de tu celular.',
     boton:'UNIRME AL GRUPO',url:'https://groups.google.com/g/remate-tester',pregunta:'¿Ya te uniste al grupo?'},
    {titulo:'Aceptá la prueba en Google Play',texto:'Tocá «Convertirse en verificador». Si dice que no está disponible, esperá un minuto y volvé a intentarlo.',
     boton:'ACEPTAR PRUEBA',url:'https://play.google.com/apps/testing/ar.rematevive.app',pregunta:'¿Google confirmó que sos verificador?'},
    {titulo:'Instalá Remate Vive',texto:'Se abre Google Play. Tocá «Instalar».',
     boton:'INSTALAR DESDE GOOGLE PLAY',url:'https://play.google.com/store/apps/details?id=ar.rematevive.app',pregunta:'¿Terminaste de instalarla?'}
  ];
  var K='rv-asistente-v2',e={paso:0,volvio:false};   // paso 0..2, 3 = final; volvio = ya abrió el enlace del paso
  try{var g=JSON.parse(localStorage.getItem(K)||'null');if(g&&typeof g.paso==='number')e=g}catch(x){}
  function guardar(){try{localStorage.setItem(K,JSON.stringify(e))}catch(x){}}
  var M=document.getElementById('pantalla');
  function el(tag,attrs,txt){var n=document.createElement(tag);for(var k in attrs)n.setAttribute(k,attrs[k]);if(txt)n.textContent=txt;return n}
  function pintar(){
    M.innerHTML='';
    if(e.paso>=PASOS.length){
      var f=el('div',{'class':'final'});f.appendChild(el('div',{'class':'sello','aria-hidden':'true'},'✓'));
      f.appendChild(el('h1',{},'¡Gracias por participar!'));
      f.appendChild(el('p',{},'Mantenete inscrito durante 14 días y dejá la app instalada. Las actualizaciones llegan solas por Google Play.'));
      M.appendChild(f);
      var a=el('div',{'class':'acciones'}),b=el('button',{'class':'atras',type:'button'},'← Volver al paso anterior');
      b.onclick=function(){e={paso:PASOS.length-1,volvio:true};guardar();pintar()};a.appendChild(b);M.appendChild(a);return;
    }
    var p=PASOS[e.paso];
    if(e.paso>0||e.volvio){var at=el('button',{'class':'atras',type:'button'},'← Paso anterior');
      at.onclick=function(){if(e.volvio)e.volvio=false;else e={paso:e.paso-1,volvio:false};guardar();pintar()};M.appendChild(at)}
    M.appendChild(el('p',{'class':'indicador'},'Paso '+(e.paso+1)+' de '+PASOS.length));
    var acc=el('div',{'class':'acciones'});
    if(!e.volvio){
      M.appendChild(el('h1',{},p.titulo));M.appendChild(el('p',{},p.texto));
      var ir=el('a',{'class':'boton',href:p.url,target:'_blank',rel:'noopener'},p.boton);
      ir.onclick=function(){e.volvio=true;guardar();setTimeout(pintar,300)};   // al volver a esta pestaña ya se ve la confirmación
      acc.appendChild(ir);
    }else{
      M.appendChild(el('h1',{},p.pregunta));
      M.appendChild(el('p',{},'Si no se pudo, abrilo de nuevo.'));
      var si=el('button',{'class':'boton',type:'button'},e.paso===PASOS.length-1?'FINALIZAR':'SÍ, CONTINUAR');
      si.onclick=function(){e={paso:e.paso+1,volvio:false};guardar();pintar();window.scrollTo(0,0)};
      var otra=el('a',{'class':'secundario',href:p.url,target:'_blank',rel:'noopener'},'Abrir de nuevo');
      acc.appendChild(si);acc.appendChild(otra);
    }
    M.appendChild(acc);
  }
  pintar();
})();
</script>
</body>
</html>
