<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Probá Rema Top</title>
<meta name="description" content="Probá Rema Top en Android: unite al grupo, activá tu acceso y descargá la app.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#013d24">
<link rel="icon" href="rematop-logo.png">
<!-- Inscripción de verificadores de Rema Top (prueba cerrada de Google Play, ar.rematevive.app).
     Tres pasos, un solo botón por pantalla. Sin formularios, cookies ni analítica.
     Google no informa a esta página si la persona completó cada paso: al volver de Google Groups o de Google Play
     solo se muestra el paso siguiente (nunca se afirma que el anterior salió bien). El avance queda en el navegador (localStorage). -->
<style>
:root{--verde:#013d24;--menta:#05fbbc;--texto:#10231a;--gris:#5b6b63;--fondo:#ffffff}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--fondo);color:var(--texto);-webkit-text-size-adjust:100%}
main{min-height:100%;max-width:30rem;margin:0 auto;padding:28px 22px 32px;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{width:112px;height:112px;margin:8px 0 10px}
.marca{font-size:1.05rem;font-weight:800;letter-spacing:.08em;color:var(--verde);margin:0 0 26px}
.puntos{display:flex;gap:8px;margin:0 0 8px}
.puntos i{width:10px;height:10px;border-radius:50%;background:#d5ddd9}
.puntos i.si{background:var(--verde)}
.paso{color:var(--gris);font-size:1rem;margin:0 0 18px}
h1{font-size:2rem;line-height:1.15;margin:0 0 14px}
p{font-size:1.2rem;line-height:1.45;margin:0 0 10px;color:#2c3d35}
.boton{display:block;width:100%;margin-top:26px;text-decoration:none;background:var(--verde);color:#fff;font-weight:800;font-size:1.3rem;letter-spacing:.02em;padding:22px 16px;border-radius:16px;box-shadow:0 0 0 4px var(--menta)}
.boton:active{transform:scale(.98)}
.ayuda{font-size:1rem;color:var(--gris);margin-top:20px;line-height:1.45}
.ayuda b{color:var(--texto)}
.volver{margin-top:auto;padding-top:34px;font-size:.95rem;color:var(--gris);background:none;border:0;text-decoration:underline;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<main>
  <img class="logo" src="rematop-logo.png" alt="Rema Top" width="112" height="112">
  <p class="marca">REMA TOP</p>
  <div class="puntos" aria-hidden="true"><i></i><i></i><i></i></div>
  <p class="paso" id="paso"></p>
  <h1 id="titulo"></h1>
  <p id="texto"></p>
  <a class="boton" id="boton" target="_blank" rel="noopener"></a>
  <p class="ayuda" id="ayuda"></p>
  <button class="volver" id="volver" type="button" hidden>← Volver al paso anterior</button>
</main>
<script>
(function(){
  // Enlaces oficiales. La app figura en Google Play como «remate vive» (paquete ar.rematevive.app).
  var PASOS=[
    {titulo:'Probá Rema Top',texto:'Primero, unite al grupo de prueba.',boton:'1. UNIRME AL GRUPO',
     // Pasa por el acceso de Google y vuelve al grupo: sin sesión, Google Groups muestra «No tienes permiso» sin botón para unirse
     // y su propio «Acceder» lleva a la portada de Grupos, no a este grupo. Con sesión iniciada pasa directo (passive=true).
     url:'https://accounts.google.com/ServiceLogin?hl=es-419&passive=true&continue=https%3A%2F%2Fgroups.google.com%2Fg%2Fremate-tester',
     ayuda:'Tocá <b>«Unirse al grupo»</b> con la misma cuenta de Google que usás en el Play Store de tu celular.'},
    {titulo:'Ahora activá tu acceso a la aplicación',texto:'Este paso es obligatorio: sin él la app no aparece en Google Play.',boton:'2. ACTIVAR MI ACCESO',
     url:'https://play.google.com/apps/testing/ar.rematevive.app',
     ayuda:'Tocá <b>«Convertirte en verificador»</b> (o «Become a tester»). Tiene que aparecer <b>«Ya eres verificador»</b>. Usá la misma cuenta del paso 1.'},
    {titulo:'¡Ya podés descargar Rema Top!',texto:'Se abre Google Play: tocá «Instalar».',boton:'3. DESCARGAR APLICACIÓN',
     url:'https://play.google.com/store/apps/details?id=ar.rematevive.app',
     ayuda:'En Google Play figura como <b>«remate vive»</b>. Si dice que no está disponible: revisá que el Play Store use la misma cuenta (tu foto, arriba a la derecha) y probá de nuevo en unos minutos.'}
  ];
  var K='rematop-inscripcion-v3',e={paso:0,abierto:-1};   // abierto = paso cuyo enlace se abrió y del que todavía no volvió
  try{var g=JSON.parse(localStorage.getItem(K)||'null');if(g&&g.paso>=0&&g.paso<3)e=g}catch(x){}
  function guardar(){try{localStorage.setItem(K,JSON.stringify(e))}catch(x){}}
  var $=function(id){return document.getElementById(id)};
  function pintar(){
    var p=PASOS[e.paso];
    $('paso').textContent='Paso '+(e.paso+1)+' de 3';
    $('titulo').textContent=p.titulo;$('texto').textContent=p.texto;
    $('boton').textContent=p.boton;$('boton').href=p.url;$('ayuda').innerHTML=p.ayuda;
    $('volver').hidden=e.paso===0;
    var d=document.querySelectorAll('.puntos i');for(var i=0;i<3;i++)d[i].className=i<=e.paso?'si':'';
    document.title=e.paso===0?'Probá Rema Top':'Paso '+(e.paso+1)+' de 3 · Rema Top';
  }
  // Al volver de Google (pestaña visible otra vez, o la página recargada) se muestra el paso siguiente.
  function alVolver(){if(document.visibilityState!=='hidden'&&e.abierto===e.paso&&e.paso<2){e={paso:e.paso+1,abierto:-1};guardar();pintar();window.scrollTo(0,0)}}
  $('boton').addEventListener('click',function(){e.abierto=e.paso;guardar()});
  $('volver').addEventListener('click',function(){e={paso:Math.max(0,e.paso-1),abierto:-1};guardar();pintar()});
  document.addEventListener('visibilitychange',alVolver);
  window.addEventListener('pageshow',function(){alVolver()});
  pintar();alVolver();
})();
</script>
</body>
</html>
