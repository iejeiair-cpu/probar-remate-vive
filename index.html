<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Probá Rema Top</title>
<meta name="description" content="Probá Rema Top en Android: un botón y seguís siempre hacia adelante hasta instalarla.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#013d24">
<link rel="icon" href="rematop-logo.png">
<!-- Inscripción de verificadores de Rema Top (prueba cerrada de Google Play, ar.rematevive.app).
     UNA pantalla y UN botón. El recorrido sigue siempre hacia adelante, sin volver a esta página:
     Google Groups («Unirse al grupo») → conversación fijada «SIGUIENTE PASO: ACTIVAR REMA TOP» → Google Play
     («Convertirse en probador» → «descárgala en Google Play») → «Instalar».
     El botón pasa por el acceso de Google y vuelve al grupo: sin sesión, Google Groups muestra «No tienes permiso»
     sin botón para unirse. Sin formularios, cookies, analítica ni almacenamiento. -->
<style>
:root{--verde:#013d24;--menta:#05fbbc;--texto:#10231a;--gris:#4d5d55}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:var(--texto);-webkit-text-size-adjust:100%}
main{max-width:30rem;margin:0 auto;padding:26px 22px 36px;text-align:center}
.logo{width:104px;height:104px;margin:6px 0 8px}
h1{font-size:2.1rem;line-height:1.15;margin:0 0 22px}
ol{list-style:none;padding:0;margin:0 0 26px;text-align:left}
li{display:flex;gap:14px;align-items:flex-start;font-size:1.2rem;line-height:1.4;margin:0 0 16px}
li b{color:var(--verde)}
.n{flex:0 0 34px;height:34px;border-radius:50%;background:var(--verde);color:var(--menta);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:1.05rem}
.boton{display:block;width:100%;text-decoration:none;background:var(--verde);color:#fff;font-weight:800;font-size:1.4rem;letter-spacing:.03em;padding:22px 16px;border-radius:16px;box-shadow:0 0 0 4px var(--menta)}
.boton:active{transform:scale(.98)}
.nota{font-size:1rem;color:var(--gris);margin-top:18px;line-height:1.45}
</style>
</head>
<body>
<main>
  <img class="logo" src="rematop-logo.png" alt="Rema Top" width="104" height="104">
  <h1>Probá Rema Top</h1>
  <ol>
    <li><span class="n">1</span><span>Tocá <b>«Unirse al grupo»</b>.</span></li>
    <li><span class="n">2</span><span>Tocá <b>«SIGUIENTE PASO: ACTIVAR REMA TOP»</b> y el enlace.</span></li>
    <li><span class="n">3</span><span>Tocá <b>«Convertirse en probador»</b>, después <b>«descárgala en Google Play»</b> e <b>Instalar</b>.</span></li>
  </ol>
  <a class="boton" href="https://accounts.google.com/ServiceLogin?hl=es-419&amp;passive=true&amp;continue=https%3A%2F%2Fgroups.google.com%2Fg%2Fremate-tester">EMPEZAR</a>
  <p class="nota">Usá la cuenta de Google de tu Play Store. En Google Play la app figura como «remate vive».</p>
</main>
</body>
</html>
